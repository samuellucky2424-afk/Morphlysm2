plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

def morphlyBackendUrl = providers.gradleProperty("MORPHLY_BACKEND_BASE_URL")
        .orElse(providers.environmentVariable("MORPHLY_BACKEND_BASE_URL"))
        .orElse("https://morphlysm2.vercel.app/api")
        .get()
def releaseKeystorePath = providers.gradleProperty("MORPHLY_KEYSTORE_FILE")
        .orElse(providers.environmentVariable("MORPHLY_KEYSTORE_FILE"))
        .orNull
def releaseKeystorePassword = providers.gradleProperty("MORPHLY_KEYSTORE_PASSWORD")
        .orElse(providers.environmentVariable("MORPHLY_KEYSTORE_PASSWORD"))
        .orNull
def releaseKeyAlias = providers.gradleProperty("MORPHLY_KEY_ALIAS")
        .orElse(providers.environmentVariable("MORPHLY_KEY_ALIAS"))
        .orNull
def releaseKeyPassword = providers.gradleProperty("MORPHLY_KEY_PASSWORD")
        .orElse(providers.environmentVariable("MORPHLY_KEY_PASSWORD"))
        .orNull
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.toString().isBlank() }

def morphlyAbis = providers.gradleProperty('morphlyAbis').orElse('armeabi-v7a,arm64-v8a').get().split(',').collect { it.trim() }

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    // Use the complete NDK installed in the local Android SDK. The previous
    // 29.0.13846066 directory was an incomplete installer stub.
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "top.niunaijun.blackbox"
        minSdk Math.max(rootProject.ext.minSdk as int, 26)
        targetSdk rootProject.ext.targetSdkVersion
        // CI (android-release.yml) passes -PmorphlyVersionCode / -PmorphlyVersionName; local builds keep the defaults.
        versionCode((providers.gradleProperty("morphlyVersionCode").orNull ?: rootProject.ext.versionCode.toString()) as int)
        versionName(providers.gradleProperty("morphlyVersionName").orNull ?: rootProject.ext.versionName)
        buildConfigField "String", "BACKEND_BASE_URL",
                "\"${morphlyBackendUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters(*morphlyAbis)
        }

        splits {
            abi {
                enable true
                reset()
                
                include(*morphlyAbis)
                universalApk true
            }
        }
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled providers.gradleProperty("morphlyMinify").orElse("true").get().toBoolean()
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            java.srcDirs += file('../android_virtual_cam/app/src/main/java')
            java.exclude 'com/example/vcam/MainActivity.java'
            assets.srcDirs += file('../android_virtual_cam/app/src/main/assets')
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "Morphly_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':Bcore')
    compileOnly files('../android_virtual_cam/app/libs/api-82.jar')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.core.ktx
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation "androidx.preference:preference-ktx:1.1.1"
    
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation "ai.xmax:xmax-sdk:1.1.0"
    // Pro (Vidu S2-Editing realtime) runs over AliRTC; 64-bit only (see packaging excludes below).
    implementation "com.aliyun.aio:AliVCSDK_ARTC:7.17.1-57750161"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.gitee.cbfg5210:RVAdapter:0.3.7'

    
    implementation 'com.github.Othershe:CornerLabelView:1.0.0'
    
    implementation 'com.github.nukc.stateview:kotlin:2.2.0'
    
    implementation 'com.github.Ferfalk:SimpleSearchView:0.2.0'
    implementation 'com.tbuonomo:dotsindicator:4.2'
    
    implementation 'org.osmdroid:osmdroid-android:6.1.11'
    
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'





    
    implementation 'androidx.work:work-runtime:2.11.2'

}

// Keep the APK light: AliRTC's ~13 MB 32-bit natives are dropped; Pro reports "needs a 64-bit phone" there.
android {
    packaging {
        jniLibs {
            excludes += ['lib/armeabi-v7a/liball_in_one.so', 'lib/armeabi-v7a/libalivcffmpeg.so']
        }
    }
}
