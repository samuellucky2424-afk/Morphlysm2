pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://www.jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository { maven { url 'https://repo.maven.apache.org/maven2' } }
            filter { includeGroup('ai.xmax') }
        }
        // AliRTC (Pro) only lives on Aliyun; everything else resolves from Google/Central first so an
        // Aliyun mirror outage (502s broke a release build) can't fail unrelated dependencies.
        exclusiveContent {
            forRepository { maven { url 'https://maven.aliyun.com/repository/releases' } }
            filter { includeGroupByRegex('com\\.aliyun\\.aio.*') }
        }
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

rootProject.name = "NewBlackbox"

include ':app'
include(":black-reflection")
include(":compiler")
include ':Bcore'
