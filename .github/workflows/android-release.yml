name: Android release

on:
  push:
    branches: [main]
    tags: ['v1.*']
    paths:
      - 'app/**'
      - 'Bcore/**'
      - 'android_virtual_cam/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The in-app updater compares this versionCode with the installed build.
          # v1.0.8 shipped as versionCode 1008, so the next public build is 1009 / 1.0.9.
          CODE=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' build.gradle | head -1)
          NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' build.gradle | head -1)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "::error::versionCode or versionName missing from build.gradle"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if gh release view "v$NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$NAME already exists; skipping another publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install NDK
        if: steps.ver.outputs.skip != 'true'
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKM" "ndk;28.2.13676358" > /dev/null

      - name: Restore signing keystore
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morphly-release.p12"

      - name: Build release APK
        if: steps.ver.outputs.skip != 'true'
        env:
          MORPHLY_KEYSTORE_FILE: ${{ runner.temp }}/morphly-release.p12
          MORPHLY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MORPHLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MORPHLY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace \
            -PmorphlyVersionCode=${{ steps.ver.outputs.code }} \
            -PmorphlyVersionName=${{ steps.ver.outputs.name }} \
            -PmorphlyMinify=false
          ls -l app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*universal-release.apk "Morphly-v${{ steps.ver.outputs.name }}.apk"
          # Fixed-name copy for the permanent link .../releases/latest/download/Morphly.apk
          cp "Morphly-v${{ steps.ver.outputs.name }}.apk" Morphly.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs Morphly.apk

      - name: Publish GitHub release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VNAME: ${{ steps.ver.outputs.name }}
          VCODE: ${{ steps.ver.outputs.code }}
        run: |
          cat > notes.md << EOF
Android 16 support for Samsung phones, fixes for cloning apps and Google Play services, permission prompts that stay granted, and the virtual camera working in WhatsApp video calls.

versionCode: $VCODE
sha256: $(sha256sum Morphly.apk | awk '{print $1}')
EOF
          gh release create "v$VNAME" "Morphly-v$VNAME.apk" Morphly.apk \
            --title "Morphly v$VNAME" --notes-file notes.md --target "$GITHUB_SHA" --latest --draft=false --prerelease=false
