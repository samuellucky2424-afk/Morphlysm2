name: Android release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Bcore/**'
      - 'android_virtual_cam/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Next patch number = number of existing v1.0.* releases (starts at 0).
          N=$(gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName -q '[.[].tagName | select(startswith("v1.0."))] | length')
          echo "name=1.0.$N" >> "$GITHUB_OUTPUT"
          # Above the last hand-built versionCode (402) so every CI build is an upgrade.
          echo "code=$(( 1000 + N ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install NDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKM" "ndk;28.2.13676358" > /dev/null

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/morphly-release.p12"

      - name: Build release APK
        env:
          MORPHLY_KEYSTORE_FILE: ${{ runner.temp }}/morphly-release.p12
          MORPHLY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MORPHLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MORPHLY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace \
            -PmorphlyVersionCode=${{ steps.ver.outputs.code }} \
            -PmorphlyVersionName=${{ steps.ver.outputs.name }} \
            -PmorphlyMinify=false
          ls -l app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*universal-release.apk "Morphly-v${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          VNAME: ${{ steps.ver.outputs.name }}
          VCODE: ${{ steps.ver.outputs.code }}
        run: |
          printf '%s\n\nversionCode: %s\n' "${COMMIT_MSG:-Manual build}" "$VCODE" > notes.md
          gh release create "v$VNAME" "Morphly-v$VNAME.apk" \
            --title "Morphly v$VNAME" --notes-file notes.md --target "$GITHUB_SHA" --latest
