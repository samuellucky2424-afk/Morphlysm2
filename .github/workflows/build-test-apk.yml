name: Build Morphly test APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-test-build
    paths:
      - '.github/workflows/build-test-apk.yml'
      - 'app/**'
      - 'android_virtual_cam/**'
      - 'build.gradle'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build native x86_64 hook library
        run: |
          sdkmanager "ndk;28.2.13676358"
          curl --fail --location https://codeload.github.com/jmpews/Dobby/tar.gz/9c85e74f92eda36b99ddb0fddb17a9df2278a4d3 -o /tmp/dobby.tar.gz
          mkdir -p /tmp/dobby-source
          tar -xzf /tmp/dobby.tar.gz --strip-components=1 -C /tmp/dobby-source
          sed -i '1i#include <android/log.h>' /tmp/dobby-source/external/logging/logging.c
          cmake -S /tmp/dobby-source -B /tmp/dobby-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDOBBY_GENERATE_SHARED=OFF -DBUILD_EXAMPLE=OFF -DBUILD_TEST=OFF
          cmake --build /tmp/dobby-build --target dobby --parallel 2
          mkdir -p Bcore/src/main/cpp/Dobby/x86_64
          cp /tmp/dobby-build/libdobby.a Bcore/src/main/cpp/Dobby/x86_64/libdobby.a
      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PmorphlyAbis=x86_64 --stacktrace
      - name: Save APKs for download
        uses: actions/upload-artifact@v4
        with:
          name: morphly-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
